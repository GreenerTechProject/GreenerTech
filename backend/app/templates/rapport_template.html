<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rapport Technique</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2cm;
            color: #2c3e50;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #2980b9;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        header img {
            height: 60px;
        }

        header h1 {
            flex-grow: 1;
            text-align: center;
            color: #2980b9;
            margin: 0;
            font-size: 28px;
        }

        .section {
            margin-top: 20px;
        }

        .label {
            font-weight: bold;
        }

        .content {
            margin-left: 10px;
        }

        footer {
            margin-top: 80px;
            text-align: center;
            font-size: 0.8em;
            color: #999;
        }
    </style>
</head>
<body>
    <header>
        <!-- Remplace "logo.png" par le chemin absolu ou l'URL de ton logo -->
        <img src="file:///app/app/static/logo.png" alt="Logo GreenerTech" style="width: 150px;">
        <h1>📋 Rapport Technique</h1>
    </header>

    <div class="section">
        <span class="label">Rédigé par :</span>
        <span class="content">{{ user_name }}</span>
    </div>

    <div class="section">
        <span class="label">ID de la Serre :</span>
        <span class="content">{{ id_serre }}</span>
    </div>

    <div class="section">
        <span class="label">Date :</span>
        <span class="content">{{ date }}</span>
    </div>

    <div class="section">
        <span class="label">Description :</span>
        <div class="content">{{ description }}</div>
    </div>

    <footer>
        Rapport généré automatiquement - GreenerTech © {{ date }}
    </footer>
</body>
</html>
