version: '3.8'

services:
  backend:
    build:
      context: ./
      dockerfile: ../backend.Dockerfile
    container_name: greenertech-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/greenertech
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: greenertech-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greenertech
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    build:
      context: ./
      dockerfile: ../frontend.Dockerfile
    container_name: greenertech-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
